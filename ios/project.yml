name: MetaMod
options:
  bundleIdPrefix: com.justinborgwardt
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true

packages:
  DesignSystem:
    path: Packages/DesignSystem
  AIProviders:
    path: Packages/AIProviders
  GlassesKit:
    path: Packages/GlassesKit
  AgentGateway:
    path: Packages/AgentGateway
  RealtimeVoice:
    path: Packages/RealtimeVoice
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
  HaishinKit:
    url: https://github.com/Turbo1123/HaishinKit.swift
    branch: fix-concurrency
  Inject:
    url: https://github.com/krzysztofzablocki/Inject
    from: 1.5.2

settings:
  base:
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    # DEVELOPMENT_TEAM and the Meta Wearables credentials (META_APP_ID / CLIENT_TOKEN)
    # live in the gitignored Config/Secrets.xcconfig, wired via the target's
    # configFiles below so they stay out of source control.

targets:
  MetaMod:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources/Assets.xcassets
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justinborgwardt.supermeta
        INFOPLIST_FILE: App/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Inject hot reload needs interposable symbols (Debug only).
        Debug:
          OTHER_LDFLAGS: [-Xlinker, -interposable]
    dependencies:
      - package: Inject
      - package: DesignSystem
      - package: AIProviders
      - package: GlassesKit
      - package: AgentGateway
      - package: RealtimeVoice
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
      - package: MetaWearablesDAT
        product: MWDATSpeech
      - package: MetaWearablesDAT
        product: MWDATInputs
      - package: MetaWearablesDAT
        product: MWDATMockDevice
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: RTMPHaishinKit
